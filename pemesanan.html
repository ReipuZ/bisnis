<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pemesanan - Coffee Kita</title>

    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body
    class="bg-stone-50 text-stone-800"
    x-data="coffeeShop()"
    x-init="init()"
>

    <!-- NAVBAR -->

    <nav class="bg-white shadow-sm sticky top-0 z-50">

        <div class="max-w-6xl mx-auto px-6 py-4">

            <div class="flex justify-between items-center">

                <a href="index.html"
                    class="text-2xl font-bold text-amber-800">
                    ☕ Coffee Kita
                </a>

                <a href="produk.html"
                    class="text-stone-600 hover:text-amber-800">
                    ← Kembali ke Produk
                </a>

            </div>

        </div>

    </nav>


    <!-- HEADER -->

    <section class="bg-amber-900 text-white">

        <div class="max-w-6xl mx-auto px-6 py-14 text-center">

            <p class="text-amber-300 font-semibold mb-2">
                CHECKOUT
            </p>

            <h1 class="text-4xl md:text-5xl font-bold">
                Form Pemesanan
            </h1>

            <p class="text-amber-100 mt-3">
                Lengkapi data untuk menyelesaikan pesanan kamu.
            </p>

        </div>

    </section>


    <!-- FORM -->

    <main class="max-w-6xl mx-auto px-6 py-12">

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">


            <!-- DATA PEMESAN -->

            <div class="bg-white rounded-2xl shadow-sm p-8">

                <h2 class="text-2xl font-bold mb-6">
                    Data Pemesan
                </h2>

                <form
                    @submit.prevent="submitOrder()"
                    class="space-y-5"
                >

                    <!-- NAMA -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            x-model="customer.name"
                            required
                            placeholder="Masukkan nama lengkap"
                            class="w-full border border-stone-300 rounded-xl px-4 py-3
                            focus:outline-none focus:ring-2 focus:ring-amber-700"
                        >

                    </div>


                    <!-- WHATSAPP -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Nomor WhatsApp
                        </label>

                        <input
                            type="tel"
                            x-model="customer.phone"
                            required
                            placeholder="08xxxxxxxxxx"
                            class="w-full border border-stone-300 rounded-xl px-4 py-3
                            focus:outline-none focus:ring-2 focus:ring-amber-700"
                        >

                    </div>


                    <!-- ALAMAT -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Alamat
                        </label>

                        <textarea
                            x-model="customer.address"
                            required
                            rows="4"
                            placeholder="Masukkan alamat lengkap"
                            class="w-full border border-stone-300 rounded-xl px-4 py-3
                            focus:outline-none focus:ring-2 focus:ring-amber-700"
                        ></textarea>

                    </div>


                    <!-- CATATAN -->

                    <div>

                        <label class="block font-semibold mb-2">
                            Catatan Pesanan
                        </label>

                        <textarea
                            x-model="customer.note"
                            rows="3"
                            placeholder="Contoh: Tidak terlalu manis"
                            class="w-full border border-stone-300 rounded-xl px-4 py-3
                            focus:outline-none focus:ring-2 focus:ring-amber-700"
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="w-full bg-amber-800 text-white py-4 rounded-xl
                        font-bold hover:bg-amber-900 transition btn-coffee"
                    >
                        Pesan Sekarang ☕
                    </button>

                </form>

            </div>


            <!-- RINGKASAN PESANAN -->

            <div>

                <div class="bg-white rounded-2xl shadow-sm p-8">

                    <h2 class="text-2xl font-bold mb-6">
                        Ringkasan Pesanan
                    </h2>


                    <!-- PRODUK -->

                    <div class="space-y-4">

                        <template
                            x-for="item in cart"
                            :key="item.id"
                        >

                            <div
                                class="flex items-center gap-4 border-b
                                border-stone-100 pb-4"
                            >

                                <img
                                    :src="item.image"
                                    :alt="item.name"
                                    class="w-16 h-16 rounded-xl object-cover"
                                >

                                <div class="flex-1">

                                    <h3
                                        class="font-bold"
                                        x-text="item.name"
                                    ></h3>

                                    <p class="text-sm text-stone-500">

                                        <span x-text="item.quantity"></span>
                                        x
                                        Rp<span
                                            x-text="formatPrice(item.price)"
                                        ></span>

                                    </p>

                                </div>

                                <p class="font-bold text-amber-800">

                                    Rp<span
                                        x-text="formatPrice(item.price * item.quantity)"
                                    ></span>

                                </p>

                            </div>

                        </template>

                    </div>


                    <!-- TOTAL -->

                    <div class="border-t mt-6 pt-5">

                        <div class="flex justify-between text-lg">

                            <span class="font-semibold">
                                Total
                            </span>

                            <span class="font-bold text-amber-800">

                                Rp<span
                                    x-text="formatPrice(totalPrice)"
                                ></span>

                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-stone-900 text-white">

        <div class="max-w-6xl mx-auto px-6 py-8 text-center">

            <p class="text-stone-400">
                © 2026 Coffee Kita. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="./js/script.js"></script>

</body>

</html>
