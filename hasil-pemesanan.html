<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pesanan Berhasil - Coffee Kita</title>

    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="./css/style.css">

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

</head>


<body
    class="bg-stone-50 text-stone-800"
    x-data="coffeeShop()"
    x-init="init()"
>


    <!-- NAVBAR -->

    <nav class="bg-white shadow-sm">

        <div class="max-w-6xl mx-auto px-6 py-4">

            <a
                href="index.html"
                class="text-2xl font-bold text-amber-800"
            >
                ☕ Coffee Kita
            </a>

        </div>

    </nav>


    <!-- HASIL PESANAN -->

    <main class="min-h-[80vh] flex items-center justify-center px-6 py-16">

        <div class="max-w-2xl w-full bg-white rounded-3xl shadow-lg p-8 md:p-12 text-center">


            <!-- ICON -->

            <div
                class="w-20 h-20 mx-auto bg-green-100 rounded-full
                flex items-center justify-center text-4xl mb-6"
            >
                ✓
            </div>


            <p class="text-green-600 font-bold mb-2">
                PESANAN BERHASIL
            </p>


            <h1 class="text-3xl md:text-4xl font-bold mb-4">
                Terima Kasih, <span x-text="order.name"></span>!
            </h1>


            <p class="text-stone-600 leading-relaxed mb-8">
                Pesanan kamu telah berhasil dicatat.
                Berikut adalah ringkasan pesanan kamu.
            </p>


            <!-- DETAIL PEMESAN -->

            <div
                class="text-left bg-stone-50 rounded-2xl p-6 mb-6"
            >

                <h2 class="font-bold text-lg mb-4">
                    Informasi Pemesan
                </h2>

                <div class="space-y-2 text-stone-600">

                    <p>
                        <strong>Nama:</strong>
                        <span x-text="order.name"></span>
                    </p>

                    <p>
                        <strong>WhatsApp:</strong>
                        <span x-text="order.phone"></span>
                    </p>

                    <p>
                        <strong>Alamat:</strong>
                        <span x-text="order.address"></span>
                    </p>

                    <p x-show="order.note">
                        <strong>Catatan:</strong>
                        <span x-text="order.note"></span>
                    </p>

                </div>

            </div>


            <!-- PRODUK -->

            <div
                class="text-left border border-stone-200 rounded-2xl p-6 mb-6"
            >

                <h2 class="font-bold text-lg mb-4">
                    Detail Pesanan
                </h2>


                <div class="space-y-3">

                    <template
                        x-for="item in order.items"
                        :key="item.id"
                    >

                        <div class="flex justify-between gap-4">

                            <div>

                                <p
                                    class="font-semibold"
                                    x-text="item.name"
                                ></p>

                                <p class="text-sm text-stone-500">

                                    <span
                                        x-text="item.quantity"
                                    ></span>

                                    x Rp<span
                                        x-text="formatPrice(item.price)"
                                    ></span>

                                </p>

                            </div>

                            <p class="font-semibold">

                                Rp<span
                                    x-text="formatPrice(item.price * item.quantity)"
                                ></span>

                            </p>

                        </div>

                    </template>

                </div>


                <!-- TOTAL -->

                <div
                    class="border-t border-stone-200 mt-5 pt-5
                    flex justify-between"
                >

                    <span class="font-bold">
                        Total
                    </span>

                    <span class="font-bold text-amber-800">
                        Rp<span
                            x-text="formatPrice(order.total)"
                        ></span>
                    </span>

                </div>

            </div>


            <!-- KEMBALI HOME -->

            <a
                href="index.html"
                class="inline-block bg-amber-800 text-white
                px-8 py-3.5 rounded-xl font-bold
                hover:bg-amber-900 transition btn-coffee"
            >
                ← Kembali ke Home
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-stone-900 text-white">

        <div class="max-w-6xl mx-auto px-6 py-8 text-center">

            <p class="text-stone-400">
                © 2026 Coffee Kita. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="./js/script.js"></script>

</body>

</html>
